# Local PostgreSQL for the database checks: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: parcelflow
      POSTGRES_PASSWORD: parcelflow
      POSTGRES_DB: parcelflow
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U parcelflow']
      interval: 2s
      retries: 15
